# 放到【每个 App 私有仓库】: .github/workflows/release.yml
# 唯一需要每个 App 各自维护的文件——逻辑全在公共 kit 仓库的 reusable workflow。
# 触发: ① git tag v1.2.0 && git push origin v1.2.0   ② Actions 页手动 Run（填版本号）
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0）'
        required: true

jobs:
  release:
    uses: uhyrdtrdtfg-creator/macos-app-release-kit/.github/workflows/release-reusable.yml@main
    secrets: inherit            # 继承本仓库（或所属组织）的 7 个密钥
    with:
      app_name: "{{APP_NAME}}"
      scheme: "{{XCODE_SCHEME}}"
      project: "{{PROJECT}}"              # 如 MyApp.xcodeproj
      public_repo: "{{PUBLIC_REPO}}"
      download_url_prefix: "{{DOWNLOAD_URL_PREFIX}}"
      # export_options: "ExportOptions.plist"   # 可选，默认即此
      # use_xcodegen: false                       # 用 xcodegen 的项目改 true
      # runner: "macos-15"                        # 可选
      # sparkle_version: "2.9.1"                  # 可选
