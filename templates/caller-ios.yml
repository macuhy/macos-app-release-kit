# 放到【每个 iOS App 私有仓库】: .github/workflows/testflight.yml
# 逻辑全在 kit 仓库的 ios-testflight-reusable.yml，这里只传参数 + secret。
# 触发: ① git tag v1.2.0 && git push origin v1.2.0   ② Actions 页手动 Run（填版本号）
name: TestFlight

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0）'
        required: true

# 被调用方需要 contents:write（dispatch 打 tag）；权限不能超过调用方，必须在此显式授予。
permissions:
  contents: write

jobs:
  testflight:
    uses: macuhy/macos-app-release-kit/.github/workflows/ios-testflight-reusable.yml@main
    # 跨仓库调用时 secrets: inherit 不转发组织级 secret，必须显式逐个传。
    # 这 6 个全是团队级、所有 iOS App 公用（自动签名后无需每 App 的 profile secret）。
    secrets:
      IOS_DIST_CERT_P12:      ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      APPLE_TEAM_ID:          ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID:             ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:          ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8:         ${{ secrets.ASC_API_KEY_P8 }}
    with:
      app_name: "{{APP_NAME}}"
      scheme: "{{IOS_SCHEME}}"
      project: "{{IOS_PROJECT}}"          # 如 ios/MyApp.xcodeproj
      # export_options: "ExportOptions-iOS.plist"   # 可选，默认即此
      # use_xcodegen: false                          # 用 xcodegen 的项目改 true
      # runner: "macos-15"                           # 可选
      # xcode_version: "16.4"                        # 可选，默认 latest-stable
