# 放到私有仓库: .github/workflows/release.yml
# 触发: git tag v1.2.0 && git push origin v1.2.0
name: Build & Release macOS App

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    env:
      APP_NAME: "{{APP_NAME}}"
      SCHEME: "{{XCODE_SCHEME}}"
      PUBLIC_REPO: "{{PUBLIC_REPO}}"
      DOWNLOAD_URL_PREFIX: "{{DOWNLOAD_URL_PREFIX}}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要完整历史来算 build 号

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ── 1. 导入签名证书到临时钥匙串 ───────────────────────────
      - name: Import codesign certificate
        env:
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk -F'\"' '{print $2}')" >> "$GITHUB_ENV"

      # ── 2. 计算版本号 & build 号 ──────────────────────────────
      - name: Compute version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"          # v1.2.0 -> 1.2.0
          BUILD="$(git rev-list --count HEAD)"     # 单调递增
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      # ── 3. 编译（Hardened Runtime） ───────────────────────────
      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_IDENTITY="$SIGN_ID" \
            CODE_SIGN_STYLE=Manual \
            OTHER_CODE_SIGN_FLAGS="--options=runtime --timestamp" \
            clean build
          APP_PATH="$RUNNER_TEMP/build/Build/Products/Release/$APP_NAME.app"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # ── 4. 打 DMG ─────────────────────────────────────────────
      - name: Create DMG
        run: |
          set -euo pipefail
          brew install create-dmg
          DMG="$RUNNER_TEMP/$APP_NAME-$VERSION.dmg"
          create-dmg --volname "$APP_NAME" --window-size 540 380 \
            --icon "$APP_NAME.app" 140 190 --app-drop-link 400 190 \
            "$DMG" "$APP_PATH" || true   # create-dmg 偶发非零退出但已生成
          test -f "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # ── 5. 公证 + staple ──────────────────────────────────────
      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      # ── 6. Sparkle 签名 + 生成 appcast ────────────────────────
      - name: Sign with Sparkle & generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # 取与 Sparkle 框架同版本的工具；这里用稳定版
          SPARKLE_VER="2.6.4"
          curl -L -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VER/Sparkle-$SPARKLE_VER.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          BIN="$RUNNER_TEMP/sparkle/bin"

          UPDATES="$RUNNER_TEMP/updates"
          mkdir -p "$UPDATES"
          cp "$DMG" "$UPDATES/"

          # release notes：用 tag 注释生成 html（文件名需与 DMG 同名）
          NOTES_HTML="$UPDATES/$APP_NAME-$VERSION.html"
          printf '<h2>%s</h2><p>%s</p>' "$VERSION" \
            "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -50)" > "$NOTES_HTML"

          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"

          # 生成 appcast，enclosure 指向公共仓库 Release 下载地址
          "$BIN/generate_appcast" --ed-key-file "$KEY_FILE" \
            --download-url-prefix "$DOWNLOAD_URL_PREFIX$GITHUB_REF_NAME/" \
            "$UPDATES"
          rm -f "$KEY_FILE"
          echo "APPCAST=$UPDATES/appcast.xml" >> "$GITHUB_ENV"

      # ── 7. 发布到公共仓库 ─────────────────────────────────────
      - name: Publish to public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
        run: |
          set -euo pipefail
          # 7a. 创建 Release 并上传 DMG
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --repo "$PUBLIC_REPO" \
            --title "$APP_NAME $VERSION" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"

          # 7b. 提交更新后的 appcast.xml 到公共仓库
          git clone "https://x-access-token:$GH_TOKEN@github.com/$PUBLIC_REPO.git" "$RUNNER_TEMP/pub"
          cp "$APPCAST" "$RUNNER_TEMP/pub/appcast.xml"
          cd "$RUNNER_TEMP/pub"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add appcast.xml
          git commit -m "release: $APP_NAME $VERSION (build $BUILD)" || echo "no changes"
          git push
