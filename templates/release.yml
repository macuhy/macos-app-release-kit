# 自包含版（不走 reusable workflow）：直接放进【App 私有仓库】 .github/workflows/release.yml
# 适合不想依赖公共 kit 仓库的项目。需在本仓库另备：
#   - ExportOptions.plist（根目录，见 templates/ExportOptions.plist）
#   - scripts/update_appcast.py（复制 kit 的同名脚本）
# 占位符 {{...}} 用 CONFIG.md 的值替换。
name: Build, Notarize & Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version: { description: '版本号（如 1.2.0）', required: true }

permissions:
  contents: write

env:
  APP_NAME: "{{APP_NAME}}"
  SCHEME: "{{XCODE_SCHEME}}"
  PROJECT: "{{PROJECT}}"
  PUBLIC_REPO: "{{PUBLIC_REPO}}"
  DOWNLOAD_URL_PREFIX: "{{DOWNLOAD_URL_PREFIX}}"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install certificate
        env:
          P12_BASE64:   ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"; PW="$(openssl rand -base64 32)"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"; mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Archive
        run: |
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" \
            -archivePath build/$APP_NAME.xcarchive -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--options runtime" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}"

      - name: Export
        run: |
          xcodebuild -exportArchive -archivePath build/$APP_NAME.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist

      - name: Notarize & staple
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cd build/export && zip -r -y "../$APP_NAME-notarize.zip" "$APP_NAME.app" && cd ../..
          xcrun notarytool submit "build/$APP_NAME-notarize.zip" \
            --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "build/export/$APP_NAME.app"

      - name: Create release ZIP
        run: |
          cd build/export && zip -r -y "../$APP_NAME.zip" "$APP_NAME.app" && cd ../..
          echo "ZIP_PATH=build/$APP_NAME.zip" >> "$GITHUB_ENV"

      - name: Install Sparkle tools
        run: |
          curl -L -o /tmp/Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.1/Sparkle-2.9.1.tar.xz"
          mkdir -p /tmp/sparkle && tar -xf /tmp/Sparkle.tar.xz -C /tmp/sparkle
          echo "SPARKLE_BIN=/tmp/sparkle/bin" >> "$GITHUB_ENV"

      - name: Sign with Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/sparkle_key"; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          OUT=$("$SPARKLE_BIN/sign_update" "$ZIP_PATH" -f "$KEY" 2>&1) || true; rm -f "$KEY"
          echo "ed_signature=$(echo "$OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')" >> "$GITHUB_ENV"
          echo "length=$(echo "$OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')" >> "$GITHUB_ENV"

      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" && git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish to public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ZIP_PATH" --repo "$PUBLIC_REPO" \
            --title "$APP_NAME $VERSION" --generate-notes
          git clone "https://x-access-token:$GH_TOKEN@github.com/$PUBLIC_REPO.git" "$RUNNER_TEMP/pub"
          python3 scripts/update_appcast.py "$RUNNER_TEMP/pub/appcast.xml" \
            "$APP_NAME" "$VERSION" "$BUILD_NUMBER" "$ed_signature" "$length" \
            "${DOWNLOAD_URL_PREFIX}${TAG}/${APP_NAME}.zip" \
            "https://github.com/$PUBLIC_REPO/releases/tag/$TAG"
          cd "$RUNNER_TEMP/pub"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet || git commit -m "release: $APP_NAME $VERSION (build $BUILD_NUMBER)"
          git push

      - name: Cleanup secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8 2>/dev/null || true
