# 可复用工作流（方案 B：私有源码 → 公共仓库分发）。
# 吸收参考实践：archive/export + ExportOptions、随机钥匙串、store-credentials、
# sign_update + 脚本增量更新 appcast、手动 dispatch、钥匙串清理。
# 跨仓库发布仍需 RELEASE_REPO_PAT（内置 GITHUB_TOKEN 出不了本仓库）。
name: macOS Release (reusable, two-repo)

on:
  workflow_call:
    inputs:
      app_name:            { description: "App 名（= .app 产物名）", required: true,  type: string }
      scheme:              { description: "Xcode scheme",            required: true,  type: string }
      project:             { description: "xcodeproj 路径，如 MyApp.xcodeproj", required: true, type: string }
      public_repo:         { description: "公共分发仓库 owner/repo", required: true,  type: string }
      download_url_prefix: { description: "Release 资源前缀 https://github.com/OWNER/REPO/releases/download/", required: true, type: string }
      export_options:      { description: "ExportOptions.plist 路径", required: false, type: string, default: "ExportOptions.plist" }
      use_xcodegen:        { description: "是否先 xcodegen generate", required: false, type: boolean, default: false }
      runner:              { description: "runner 标签",            required: false, type: string, default: "macos-15" }
      sparkle_version:     { description: "Sparkle 工具版本",        required: false, type: string, default: "2.9.1" }
    secrets:
      DEVELOPER_ID_CERTIFICATE_P12:      { required: true }
      DEVELOPER_ID_CERTIFICATE_PASSWORD: { required: true }
      APPLE_ID:                          { required: true }
      APPLE_ID_PASSWORD:                 { required: true }
      APPLE_TEAM_ID:                     { required: true }
      SPARKLE_PRIVATE_KEY:               { required: true }
      RELEASE_REPO_PAT:                  { required: true }

permissions:
  contents: write          # 用于 workflow_dispatch 时给私有源码仓库打 tag

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    env:
      APP_NAME: ${{ inputs.app_name }}
      SCHEME: ${{ inputs.scheme }}
      PROJECT: ${{ inputs.project }}
      PUBLIC_REPO: ${{ inputs.public_repo }}
      DOWNLOAD_URL_PREFIX: ${{ inputs.download_url_prefix }}
      EXPORT_OPTIONS: ${{ inputs.export_options }}
      SPARKLE_VER: ${{ inputs.sparkle_version }}
    steps:
      - name: Checkout (caller repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 取本 kit 仓库的脚本（update_appcast.py）
      - name: Checkout kit scripts
        uses: actions/checkout@v4
        with:
          repository: macuhy/macos-app-release-kit
          path: _kit

      - name: Install xcodegen
        if: ${{ inputs.use_xcodegen }}
        run: brew install xcodegen

      - name: Generate Xcode project
        if: ${{ inputs.use_xcodegen }}
        run: xcodegen generate

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"              >> "$GITHUB_OUTPUT"

      - name: Install certificate
        env:
          P12_BASE64:   ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"     # 随机，无需 secret
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          # printf 避免 echo 末尾换行；base64 解码 secret 还原 .p12
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          DECODED_BYTES=$(wc -c < "$CERT_PATH" | tr -d ' ')
          echo "解码后 .p12 字节数: $DECODED_BYTES"
          if [ "$DECODED_BYTES" -lt 100 ]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE_P12 解码后过小($DECODED_BYTES B)——secret 值缺失或损坏"; exit 1
          fi
          # 导入身份(cert+key)。不加 -t cert，避免对 identity 导入的类型干扰。
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "== 钥匙串内签名身份 =="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Setup notarytool credentials
        env:
          APPLE_ID:          ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "notarytool" \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID"

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Archive
        env:
          VERSION:      ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -archivePath build/$APP_NAME.xcarchive \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--options runtime" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath build/$APP_NAME.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Notarize & staple
        run: |
          set -euo pipefail
          cd build/export && zip -r -y "../$APP_NAME-notarize.zip" "$APP_NAME.app" && cd ../..
          xcrun notarytool submit "build/$APP_NAME-notarize.zip" --keychain-profile "notarytool" --wait
          xcrun stapler staple "build/export/$APP_NAME.app"

      - name: Create release ZIP
        run: |
          cd build/export && zip -r -y "../$APP_NAME.zip" "$APP_NAME.app" && cd ../..
          echo "ZIP_PATH=build/$APP_NAME.zip" >> "$GITHUB_ENV"

      - name: Install Sparkle tools
        run: |
          curl -L -o /tmp/Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VER/Sparkle-$SPARKLE_VER.tar.xz"
          mkdir -p /tmp/sparkle && tar -xf /tmp/Sparkle.tar.xz -C /tmp/sparkle
          echo "SPARKLE_BIN=/tmp/sparkle/bin" >> "$GITHUB_ENV"

      - name: Sign update with Sparkle EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGN_OUTPUT=$("$SPARKLE_BIN/sign_update" "$ZIP_PATH" -f "$KEY_FILE" 2>&1) || true
          rm -f "$KEY_FILE"
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          if [ -z "$ED_SIGNATURE" ] || [ -z "$LENGTH" ]; then
            echo "::error::解析 Sparkle 签名失败: $SIGN_OUTPUT"; exit 1
          fi
          echo "ed_signature=$ED_SIGNATURE" >> "$GITHUB_ENV"
          echo "length=$LENGTH" >> "$GITHUB_ENV"

      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" && git push origin "$TAG"

      # ── 跨仓库发布到【公共仓库】(PAT) ─────────────────────────
      - name: Publish to public repo
        env:
          GH_TOKEN:     ${{ secrets.RELEASE_REPO_PAT }}
          TAG:          ${{ steps.version.outputs.tag }}
          VERSION:      ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          # 1) 在公共仓库建 Release 并上传 ZIP
          gh release create "$TAG" "$ZIP_PATH" \
            --repo "$PUBLIC_REPO" --title "$APP_NAME $VERSION" --generate-notes

          # 2) 克隆公共仓库，增量更新它的 appcast.xml 并推回
          git clone "https://x-access-token:$GH_TOKEN@github.com/$PUBLIC_REPO.git" "$RUNNER_TEMP/pub"
          DOWNLOAD_URL="${DOWNLOAD_URL_PREFIX}${TAG}/${APP_NAME}.zip"
          python3 _kit/scripts/update_appcast.py \
            "$RUNNER_TEMP/pub/appcast.xml" \
            "$APP_NAME" "$VERSION" "$BUILD_NUMBER" \
            "$ed_signature" "$length" "$DOWNLOAD_URL" \
            "https://github.com/$PUBLIC_REPO/releases/tag/$TAG"
          cd "$RUNNER_TEMP/pub"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "release: $APP_NAME $VERSION (build $BUILD_NUMBER)"
          git push

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
